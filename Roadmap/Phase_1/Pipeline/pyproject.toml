[project]
name = "pipeline"
version = "0.1.0"
description = "A data pipeline fetching from FRED and Yahoo Finance, cleaning and summarising"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fredapi>=0.5.0",
    "yfinance>=0.2.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "python-dotenv>=1.2.2",
    "pytest>=9.1.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
]
